set timeout=3
set default=0
menuentry "myos" {
	multiboot /boot/myos.bin
	# The trailing token becomes the module's command-line string, which
	# kernel/init.c uses to identify each module by name (GRUB leaves the
	# cmdline empty for `module FILE` with no arguments).
	module /boot/terminal_server.elf terminal_server.elf
	module /boot/kb_server.elf kb_server.elf
	module /boot/log_server2.elf log_server2.elf
	module /boot/portal_test.elf portal_test.elf
	module /boot/hello.elf hello.elf
	module /boot/process_test.elf process_test.elf
}
